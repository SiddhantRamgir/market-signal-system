name: Market Signal CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: market-signal-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q .

      - name: Run unit tests with coverage
        run: |
          python -m pytest -v \
            --cov=signals \
            --cov=indicators \
            --cov=ingestion \
            --cov-report=term-missing

  container-smoke-test:
    name: Container smoke test
    runs-on: ubuntu-latest
    needs: python-tests
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment configuration
        run: cp .env.example .env

      - name: Validate Docker Compose configuration
        run: docker compose config

      - name: Build and start application
        run: docker compose up --build -d

      - name: Wait for Streamlit health check
        shell: bash
        run: |
          for attempt in {1..18}; do
            echo "Health-check attempt ${attempt}"

            if curl \
              --fail \
              --silent \
              --show-error \
              http://localhost:8501/_stcore/health; then

              echo "Application is healthy."
              exit 0
            fi

            sleep 5
          done

          echo "Application failed to become healthy."
          docker compose ps
          docker compose logs --tail 200 dashboard
          exit 1

      - name: Display final container status
        if: always()
        run: docker compose ps

      - name: Display logs following failure
        if: failure()
        run: docker compose logs --tail 200 dashboard

      - name: Stop and remove CI containers
        if: always()
        run: docker compose down --volumes --remove-orphans